name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: typecheck + smoke + core selftests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm (from package.json packageManager)
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck (strict tsc, all packages)
        run: pnpm -r run typecheck

      - name: Smoke (single-process end-to-end)
        run: pnpm smoke

      - name: Onion routing selftest
        run: pnpm exec tsx scripts/onion-selftest.ts

      - name: Mint / ecash selftest
        run: pnpm exec tsx scripts/mint-selftest.ts

      - name: Relay anti-replay test
        run: pnpm exec tsx scripts/antireplay-test.ts
